approvedInstallation:
  command: >-
    python3 -m venv .research/phase1-tools &&
    .research/phase1-tools/bin/python -m pip install --disable-pip-version-check
    -r requirements-phase1-tools.txt
  constraints:
    - Run only from the repository root after this approval record is committed.
    - Install only the three approved top-level pins in requirements-phase1-tools.txt.
    - Capture the resolver's complete installed-distribution inventory in the reproducibility manifest.
    - Do not run playwright install or acquire browser binaries.
    - Do not create package.json or any production dependency manifest.
