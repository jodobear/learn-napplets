    requirements:
    - EVID-02
    - EVID-03
    - OPER-01
    phases:
    - '01'
  blockedDecisions:
  - ADR-0001
  - ADR-0002
  - ADR-0003
  - ADR-0004
  - ADR-0005
  - ADR-0006
  - ADR-0008
  - ADR-0009
  resolutionCriteria:
  - Retain the four 2026-07-31 source identities, their evidence classes, maturity,
    uncertainty, and pending review rather than treating draft or implementation material
    as a resolved protocol baseline.
  - Collect and review direct authoritative NIP-5D plus NAP registry/projection sources
    with immutable identity, revision:path locator, digest, retrieval time, authority,
    evidence class, and maturity.
  - Compare independently retrieved released public export/package/runtime evidence separately
    from the dated implementation observations and mutable open-work direction.
  - Record conflicts as parallel `DRF-*` evidence and obtain the required human review
    before any claim becomes verified; repository observations and PR metadata remain non-normative.
  owner: research-owner
  review:
    status: pending
    requiredRoles:
    - protocol-technical
    - content-learning
  history:
  - at: '2026-07-24T00:00:00Z'
    status: blocked
    reason: All relevant candidates remain discovery pointers without immutable current
      evidence.
  - at: '2026-07-31T03:08:39Z'
    status: blocked
    reason: Four immutable source blobs are now admitted, but they remain a repository-local
      draft, two implementation observations, and an optional native reference. Direct NIP-5D,
      package, runtime, browser, conformance, and required human-review gaps remain blocked.
