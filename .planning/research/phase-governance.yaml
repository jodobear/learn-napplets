  - id: CLM-UPSTREAM-BASELINE-001
    measure: blocked baseline is impact-scoped rather than inferred as an upstream fact
    expected: blocked claim with uncertainty, impact, and refresh route
    actual: blocked with canonical drift and open-question links
    path: .planning/research/claims.yaml
  - id: SPK-C-BOUNDARY-HARNESS
    measure: browser-boundary replay evidence
    expected: validated report and replay result preserving unavailable-browser evidence
    actual: Chromium fixture evidence recorded; Firefox attachment remains blocked
    path: .planning/spikes/spk-c-boundary-harness/report.md
  - id: SPK-H-BROWSER-EGRESS
    measure: security and egress evidence synthesis
    expected: pinned-source, observation, policy, question, impact, uncertainty, owner, and approval fields
    actual: complete synthesis with unresolved Firefox and upstream-evidence blockers
    path: .planning/research/security-egress-findings.md
  - id: LES-001
    measure: fixed thirteen-packet lesson index and canonical evidence validation
    expected: thirteen present packets with resolved or impact-scoped citations
    actual: all thirteen packets indexed and validated
    path: .planning/research/lesson-packets/index.yaml
  - id: ADR-0001
    measure: proposed ADR set has evidence, uncertainty, impact, approver, and revisit trigger
    expected: ADR 0001 through ADR 0011 remain proposed
    actual: proposed-only series is present for human review
    path: .planning/adr
