blockers:
  - id: OQ-FIREFOX-PLAYWRIGHT-LAUNCH-001
    state: blocked
    impact: No cross-browser browser-boundary, CSP, portable-target, or diagram recommendation; no browser workaround is authorized.
    owner: research-owner
  - id: DRF-FIREFOX-PLAYWRIGHT-LAUNCH-001
    state: blocked
    impact: The direct-installed Firefox observation remains a preserved conflict record because Firefox exited before Playwright attached.
    owner: research-owner
  - id: OQ-PUBLIC-PACKAGE-BASELINE-001
    state: blocked
    impact: No public package admission, consumption, update, or package-conformance claim without release, provenance, integrity, root-export, and immutable implementation evidence.
    owner: research-owner
  - id: OQ-VERIFIED-LOADER-MANIFEST-001
    state: blocked
    impact: Manifest, dTag identity, signature/blob/aggregate verification, and loader recommendations remain unavailable for Phase 2 and later teaching-host work.
    owner: research-owner
  - id: OQ-VERIFIED-LOADER-IDENTITY-001
    state: blocked
    impact: Manifest and identity teaching remains conceptual; no immutable identity mapping is accepted.
    owner: research-owner
  - id: OQ-VERIFIED-LOADER-VERIFIER-001
    state: blocked
    impact: Verifier provenance is unknown; no cryptography or production loader may be implemented from the fixture.
    owner: research-owner
  - id: OQ-EGRESS-NIP-001
    state: blocked
    impact: Egress and CSP observations remain fixture-specific; restrictive CSP is proposed project policy, not upstream protocol fact.
    owner: research-owner
  - id: OQ-UPSTREAM-BASELINE-001
    state: blocked
    impact: Protocol, runtime, compatibility, and current-work claims remain blocked until official immutable baselines are acquired and reviewed.
    owner: research-owner
  - id: ADR-0003
    state: blocked
    impact: External deployment and publication are not authorized; only local static inspection and rollback evidence exists.
    owner: research-owner
  - id: ADR-0007
    state: unresolved
    impact: Portable target is optional and deferred; it cannot block the static public learning path.
    owner: product-owner
  - id: ADR-0006
    state: unresolved
    impact: Dynamic-diagram capability remains deferred; the static diagram, transcript, and table path is the only proposed safe minimum.
    owner: accessibility-owner
  - id: ADR-0009
    state: blocked
    impact: Editor choices remain bounded to the proposed fixed-variant/native-textarea direction; Firefox and CodeJar evidence is unavailable.
    owner: research-owner
  - id: ADR-0010
    state: blocked
    impact: Public-package admission and updates remain blocked until release, root-export, provenance, integrity, implementation, compatibility, and review evidence are complete.
    owner: research-owner
  - id: ADR-0011
    state: unresolved
    impact: Freshness automation remains deferred; only targeted, human-reviewed source-refresh work is proposed.
    owner: research-owner
  - id: VITEPRESS-ACCESSIBILITY-EVIDENCE
    state: unresolved
    impact: VitePress reduced-motion and static-equivalent accessibility evidence remains unresolved and cannot support a positive framework accessibility recommendation.
    owner: accessibility-owner
