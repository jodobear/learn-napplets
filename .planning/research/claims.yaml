    kind: claim
    statement: Phase 1 policy requires immutable source identity and human review before a claim can be verified.
    rawOrigin: project-policy
    assertionKind: project-policy
    evidenceClass: project-policy
    maturity: accepted
    state: provisional
    stateReason: Policy is structurally validated; it does not itself approve a protocol-sensitive claim.
    uncertainty:
      state: limited
      reason: This constrains project process and does not prove an upstream protocol fact.
    impacts:
      requirements: [EVID-01, OPER-03]
      phases: ['01']
    sourceRelations:
      - sourceId: SRC-POLICY-002
        relation: supports
        role: primary
        locator: Required fields and verification rule
