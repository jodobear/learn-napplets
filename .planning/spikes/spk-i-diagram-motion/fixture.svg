<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1040 760" width="1040" height="760" role="img" aria-labelledby="fixture-title fixture-description" data-spike-id="SPK-I-DIAGRAM-MOTION" data-classification="synthetic-local-observation" data-status="planned" data-source-id="SRC-POLICY-002" data-claim-id="CLM-POLICY-001" data-motion-policy="no-auto-loop; named-static-steps-only" data-reset-state="step-compose">
  <title id="fixture-title">Synthetic trusted-host boundary diagram with static accessible representations</title>
  <desc id="fixture-description">A deterministic three-step synthetic flow. Keyboard-reachable links select Compose, Host sentinel, and Static result. The same labels appear in a transcript and an accessible table. Motion is not required to understand the flow.</desc>
  <metadata>{"spikeId":"SPK-I-DIAGRAM-MOTION","classification":"synthetic-local-observation","status":"planned","sourceId":"SRC-POLICY-002","claimId":"CLM-POLICY-001","motionPolicy":"no-auto-loop; named-static-steps-only"}</metadata>
  <style>
    :root { color-scheme: light; }
    .surface { fill: #ffffff; stroke: #1e293b; stroke-width: 2; }
    .step { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 3; }
    .host { fill: #ecfdf5; stroke: #047857; stroke-width: 3; }
    .result { fill: #fefce8; stroke: #a16207; stroke-width: 3; }
    .control { fill: #ffffff; stroke: #334155; stroke-width: 2; }
    .control-label, .label, .table-text, .transcript-text { fill: #0f172a; font-family: sans-serif; }
    .control-label { font-size: 18px; font-weight: 700; }
    .label { font-size: 18px; }
    .small { font-size: 15px; }
    .status { font-size: 14px; font-weight: 700; }
    .edge { fill: none; stroke: #475569; stroke-width: 3; marker-end: url(#arrowhead); }
    a:focus .control, a:focus .step, a:focus .host, a:focus .result { stroke: #c2410c; stroke-width: 6; }
    a:hover .control { fill: #f8fafc; }
    @media (prefers-reduced-motion: reduce) { .motion-cue { opacity: 1; } }
    @media (prefers-reduced-motion: no-preference) { .motion-cue { opacity: 1; } }
  </style>
