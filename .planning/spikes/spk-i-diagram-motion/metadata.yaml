successThreshold: >-
  For each available browser, five local samples expose a title and description,
  three keyboard-reachable native SVG links with visible focus, exact synthetic state
  labels in the visual flow, transcript, and accessible table, a no-motion static
  reduced-motion equivalent, deterministic reset/replay and screenshot digest, no
  script or event-attribute injection from the hostile label, and an unchanged
  trusted-host sentinel. The static SVG must remain the only passing candidate with
  measured byte/load values; any unmeasured dependency candidate remains blocked.
failureOutcome: >-
  If the fixture loses semantic, keyboard, focus, representation-parity, reset/replay,
  screenshot, or hostile-input/sentinel checks in an available browser, retain the
  failed local evidence and make no positive ADR-0006 recommendation. Do not add
  undocumented interaction logic, a visual library, an application component, or a
  dynamic learner-code surface as compensation.
blockedOutcome: >-
  If an approved direct-installed browser cannot launch or attach under Playwright
  1.61.0, record the exact block and affected checks for ADR-0006 and Phase 04 while
  preserving the known Firefox launch blocker. Do not download a browser or add
  launcher flags, profiles, preferences, or an unapproved workaround.
replay:
  input: fixture.svg
  command: >-
    Run runner.py through tools/phase1-python into /tmp/spk-i-diagram-motion, compare
    five per-browser output records and screenshot digests, then validate the completed
    spike and common research root with --report.
safety:
  noSecrets: true
  noDestructiveState: true
  liveProbe: not-used
  essential: true
uncertainty:
  state: material
  reason: >-
    Chromium proves only the bounded local semantic-DOM and screenshot contract.
    Firefox could not attach under the approved direct-installed browser route, and no
    result proves upstream behavior, production accessibility, screen-reader speech,
    runtime isolation, or ADR acceptance.
recommendation: >-
  Retain Candidate A as a proposed non-production static-first SVG baseline with
  transcript/table parity; ADR-0006 remains blocked for a cross-browser positive
  recommendation until the direct-installed Firefox/Playwright mismatch is separately
  reviewed. State/motion controllers and visual dependencies remain unselected.
disposition: retain-as-fixture
