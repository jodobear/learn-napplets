schemaVersion: 1
id: SPK-I-DIAGRAM-MOTION
kind: spike
nonProduction: true
status: blocked
hypothesis: >-
  A bounded, data-driven semantic SVG with visible focus, native keyboard-reachable
  step links, and co-located transcript/table representations can carry all essential
  synthetic teaching meaning deterministically without a visual dependency or dynamic
  learner-code execution.
variables:
  independent:
    - static data-driven semantic SVG representation
    - minimal local state/motion controller (comparison only; not introduced into the fixture)
    - visual-library dependency candidate (comparison only; no package is installed)
  dependent:
    - keyboard-reachable control count
    - SVG/transcript/table state-label parity
    - reduced-motion and reset/replay determinism
    - hostile-input containment and trusted-host sentinel integrity
    - screenshot digest stability
    - fixture byte cost and browser load timing
  controlled:
    - synthetic labels and project-policy source/status identifiers only
    - direct-installed Google Chrome and Firefox via approved Playwright 1.61.0
    - five headless local samples per available browser with no browser download, network, or dependency installation
    - isolated /tmp/spk-i-diagram-motion output only; no production route, framework, or app component
commands:
  - tools/phase1-python tools/validate-research.py validate-spike .planning/spikes/spk-i-diagram-motion --contract
  - tools/phase1-python .planning/spikes/spk-i-diagram-motion/runner.py --fixture .planning/spikes/spk-i-diagram-motion/fixture.svg --out /tmp/spk-i-diagram-motion
  - tools/phase1-python tools/validate-research.py validate-spike .planning/spikes/spk-i-diagram-motion --complete
  - tools/phase1-python tools/validate-research.py validate-report .planning/spikes/spk-i-diagram-motion/report.md
  - tools/phase1-python tools/validate-research.py validate --root .planning/research --report /tmp/spk-i-research-validation.md
