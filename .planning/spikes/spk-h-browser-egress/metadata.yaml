successThreshold: >-
  Each browser that launches and attaches completes five fresh-context samples with
  all eight declared channel groups recorded. Chromium must retain every allowed
  local-loopback endpoint result, exact CSP mode, sandbox-prohibited form/top
  navigation outcome, and received Origin/Referer values. Firefox either completes
  the same matrix or records five explicit BrowserType.launch blocks before any
  fixture claim. The restrictive CSP semantic-negative guest must reject its bounded
  fetch/image attempts in every browser that reaches fixture execution.
failureOutcome: >-
  If an available browser reaches fixture execution but any declared channel result,
  endpoint receipt, source-window mapping, CSP-negative result, or no-secret/
  loopback-only guard fails, retain the raw local observation as failed evidence and
  make no browser-policy or host recommendation. Do not add an external endpoint,
  privileged sandbox token, browser configuration, or package as compensation.
blockedOutcome: >-
  If a named direct-installed browser or approved Playwright 1.61.0 cannot launch
  or attach, record the exact execution blocker for every affected channel group.
  Preserve the known Firefox behavior when it exits before attachment; do not use a
  managed browser, launcher flags, profile, preference, or workaround.
replay:
  input: fixture.html
  command: >-
    Start only deterministic loopback endpoints, launch a fresh Playwright 1.61.0
    context for each of five samples per named browser, invoke runSpkHEgress(),
    retain bounded endpoint receipts and browser results under /tmp, then validate
    the completed spike, report, and impact fragment.
safety:
  noSecrets: true
  noDestructiveState: true
  liveProbe: not-used
externalProbeAuthorization:
  status: local-only
  decisionDate: '2026-07-24'
  approverRole: project-owner
  authorizationRule: No public probe is essential; every channel uses a deterministic local loopback endpoint.
  credentialHandling: No credentials, account access, or secret material are read, sent, or retained.
uncertainty:
  state: material
  reason: >-
    No current immutable upstream NIP browser-egress statement is available. This
    spike measures only one disposable local fixture and named browser/tooling
    surfaces; it cannot establish upstream protocol behavior, broad browser support,
    a production CSP, or ADR acceptance.
recommendation: >-
  Retain the exact SPK-C selected iframe/loading model as a disposable local
  measurement only. Treat any CSP direction as proposed public-site policy after
  security review; retain OQ-EGRESS-NIP-001 and DRF-EGRESS-001 until current
  immutable upstream evidence is collected and reviewed.
