schemaVersion: 1
id: SPK-H-BROWSER-EGRESS
kind: spike
nonProduction: true
status: blocked
hypothesis: >-
  The exact SPK-C top-level observer plus opaque-origin srcdoc guest loaded in an
  iframe with sandbox="allow-scripts" can yield bounded, reproducible local-loopback
  observations for fetch, media, scripts, WebSocket, EventSource, workers,
  form/navigation, and referrer/origin behavior without credentials, public probes,
  or an assertion about an upstream napplet requirement.
variables:
  independent:
    - 'browser family: Chromium / Google Chrome and Firefox'
    - 'CSP mode: bounded local-channel measurement or restrictive semantic-negative CSP'
    - 'channel group: fetch; images/media; classic/module scripts; WebSocket; EventSource; workers; form/navigation; referrer/origin'
  dependent:
    - local channel result and endpoint receipt
    - sandbox-prohibited form and top-navigation result
    - request Origin and Referer headers as received by the local endpoint
    - exact browser launch/attachment result
  controlled:
    - 'SPK-C selected model: top-level observer, opaque-origin srcdoc guest, sandbox=allow-scripts only'
    - deterministic local loopback endpoints with no credential, external target, upload, persistent state, or public probe
    - approved Playwright 1.61.0 with direct-installed Google Chrome 150.0.7871.124 and Firefox 152.0.4
    - five fresh browser contexts per declared browser and no explicit browser CLI flags
    - fixed fixture template and recorded CSP inputs
commands:
  - tools/phase1-python tools/validate-research.py validate-spike .planning/spikes/spk-h-browser-egress --contract
  - tools/phase1-python .planning/spikes/spk-h-browser-egress/runner.py --fixture .planning/spikes/spk-h-browser-egress/fixture.html --out /tmp/spk-h-browser-egress
  - tools/phase1-python tools/validate-research.py validate-spike .planning/spikes/spk-h-browser-egress --complete
  - tools/phase1-python tools/validate-research.py validate-report .planning/spikes/spk-h-browser-egress/report.md
  - tools/phase1-python tools/validate-research.py validate-impact-fragment .planning/spikes/spk-h-browser-egress/impact-fragment.yaml --root .planning
