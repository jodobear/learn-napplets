successThreshold: >-
  After dated human approval, every selected exact public package/version has a
  cataloged official registry and project provenance, license, release
  integrity, documented public export locator, browser-support claim, and a
  CLM relation to distinct complete immutable released-package and
  implemented-source SRC records; its declared isolated import/compile/
  conformance replay then records five reproducible observations.
failureOutcome: >-
  If an approved, fully qualified package import, compile, or public
  conformance command produces an inconsistent result, retain the exact command
  and error as implementation evidence and make no protocol-authority claim.
blockedOutcome: >-
  If any required public release, export locator, provenance, license,
  integrity, source baseline, CLM relation, or human approval is absent, make
  no package-manager call or substitute. Retain the catalog discovery pointer,
  scope, fallback, and blocked compatibility/ADR impacts.
replay:
  input: fixture.md
  command: >-
    Validate this contract through tools/phase1-python and inspect the fixture
    rules. If and only if a later exact candidate is cataloged and human-
    approved, run its recorded isolated install and public-export conformance
    command; otherwise replay outcome remains blocked without execution.
safety:
  noSecrets: true
  noDestructiveState: true
  liveProbe: not-used
uncertainty:
  state: material
  reason: >-
    CAND-NAPPLET-WEB-PACKAGE and CAND-NAPPLET-WEB-REPOSITORY remain discovery
    pointers. The registry contains only project-policy/archive SRC records,
    not an official released-package record or an implemented public-export
    source revision. Browser support, release/current-work drift, and public
    conformance surface are therefore unknown.
recommendation: >-
  Keep package consumption blocked. Do not select, install, compile against,
  wrap, or import napplet/web until a public exact release and public export
  locator are cataloged with official provenance and distinct immutable source
  baselines, then receive a dated per-candidate human approval.
