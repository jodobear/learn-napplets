schemaVersion: 1
id: SPK-G-PACKAGE-CONFORMANCE
kind: spike
nonProduction: true
status: blocked
hypothesis: >-
  A released public package export can be measured only when its exact package
  version, public export locator, registry/project provenance, license,
  integrity, implemented-source baseline, and CLM relation all resolve to
  complete immutable records. The current catalog supplies no such candidate,
  so SPK-G must retain a blocked consumption contract rather than import or
  substitute an unpublished or private surface.
variables:
  independent:
    - cataloged released public package/export candidate eligibility
    - human approval status for an exact package/version and declared command
  dependent:
    - eligible public package count
    - public export import/compile/conformance observations
    - consume, wrap, avoid, or blocked disposition
  controlled:
    - disposable SPK-G-local ignored experiment path
    - public package entry points only; no deep or monorepo paths
    - immutable SRC/CLM bindings and recorded source-baseline comparison
    - registered Plan 01-42 in-memory snapshot before evidence parsing or argv construction
    - verified no-network, readonly-repository, isolated-workspace sandbox contract before any package operation
    - tools/phase1-python contract validation and no package installation before review
commands:
  - tools/phase1-python tools/validate-research.py validate-spike .planning/spikes/spk-g-package-conformance --contract
  - tools/phase1-python tools/measure-package-conformance.py --spike .planning/spikes/spk-g-package-conformance --check
  - tools/phase1-python tools/measure-package-conformance.py --spike .planning/spikes/spk-g-package-conformance --run-five
  - >-
    The runner first reads the registered Plan 01-42 spk-g-package-evidence
    snapshot, evaluates every recovered eligibility and dated-approval field,
    then requires an auditable OS sandbox contract before package argv exists.
    Current evidence returns a no-operation blocked receipt; it never installs,
    imports, compiles, contacts a registry, or runs a browser.
environmentManifest: environment.json
