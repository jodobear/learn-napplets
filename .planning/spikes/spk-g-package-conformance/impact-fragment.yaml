proposedOpenQuestions:
  - id: OQ-PUBLIC-PACKAGE-BASELINE-001
    rationale: >-
      Collect and review an exact official public release/version, registry and
      project provenance, license, integrity, documented root export, and
      distinct immutable released-package and implementation source records
      before any SPK-G install is reconsidered.
  - id: OQ-PUBLIC-CONFORMANCE-001
    rationale: >-
      Identify a public conformance target and its immutable source baseline;
      do not infer conformance from private paths, a compile result, or an
      unpublished build.
proposedDriftRecords:
  - id: DRF-ARTIFACT-001
    rationale: >-
      Retain the blocked artifact drift record because no public release
      artifact, integrity value, or implementation baseline was available.
  - id: DRF-CONFORMANCE-001
    rationale: >-
      Retain the blocked conformance drift record because no public fixture or
      conformance target was available to execute.
