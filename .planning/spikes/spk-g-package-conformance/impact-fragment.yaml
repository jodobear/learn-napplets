proposedOpenQuestions:
- id: OQ-PUBLIC-PACKAGE-BASELINE-001
  rationale: Collect and review an exact official public release/version, registry and project provenance, license, integrity, documented root export, and distinct immutable released-package and implementation source records before any SPK-G install is reconsidered.
- id: OQ-PUBLIC-CONFORMANCE-001
  rationale: Identify a public conformance target and its immutable source baseline; do not infer conformance from private paths, a compile result, or an unpublished build.
