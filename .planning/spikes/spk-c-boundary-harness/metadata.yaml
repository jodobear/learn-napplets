successThreshold: >-
  Five clean-context samples in each declared installed browser complete both the
  declared-domain and declared-domain-removed scenarios: the first acknowledges
  pre-script injection, maps MessageEvent.source to the iframe, and receives the
  fixed successful response; the second returns the fixed domain-capability-missing
  error. Results are recorded only as browser observations.
failureOutcome: >-
  If either browser cannot complete every required primitive or returns a source
  mapping, envelope, or deterministic-response mismatch, retain the raw local
  observation as failed evidence and make no positive boundary recommendation.
blockedOutcome: >-
  If a required installed browser, approved Playwright 1.61.0 runner, immutable
  source binding, or replayable local fixture is unavailable, record an
  impact-scoped blocker for EVID-04 and ADR-0005 without substituting a browser,
  adding a package, or claiming upstream behavior.
replay:
  input: fixture.html
  command: >-
    Launch a fresh Playwright 1.61.0 context against local fixture.html for each
    declared browser and each of five samples. Invoke runBoundaryHarness(), retain
    both scenario envelopes and source mapping observations, then validate the
    completed spike, report, fragment, and planning boundary.
safety:
  noSecrets: true
  noDestructiveState: true
  liveProbe: not-used
uncertainty:
  state: material
  reason: >-
    The only available source bindings are project-policy records that explicitly
    block current upstream protocol conclusions. Browser measurements can describe
    this isolated fixture but cannot establish a shipped napplet or host protocol.
recommendation: >-
  Retain this disposable fixture only as proposed ADR-0005 browser evidence;
  preserve the upstream-source blocker and require human review before selecting a
  teaching-host profile.
