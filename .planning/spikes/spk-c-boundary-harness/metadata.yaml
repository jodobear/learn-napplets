schemaVersion: 1
id: SPK-C-BOUNDARY-HARNESS
kind: spike
nonProduction: true
status: blocked
hypothesis: >-
  A local sandboxed iframe can receive a declared domain value before its guest
  script runs, exchange a bounded postMessage request and deterministic response,
  map MessageEvent.source to its iframe window, and explicitly report the
  declared-domain-removed path in installed Chromium and Firefox without exposing
  secrets, executing guest code in a trusted top-level context, or inferring an
  upstream napplet protocol.
variables:
  independent: [browser family, declared-domain presence]
  dependent: [pre-script injection acknowledgement, request/response envelope, MessageEvent.source mapping, declared-domain removal result]
  controlled: [local fixture, sandbox allow-scripts only, clean browser context, fixed nonce, no network targets, five samples per browser]
commands:
  - tools/phase1-python tools/validate-research.py validate-spike .planning/spikes/spk-c-boundary-harness --contract
  - tools/phase1-python .planning/spikes/spk-c-boundary-harness/runner.py
  - tools/phase1-python tools/validate-research.py validate-spike .planning/spikes/spk-c-boundary-harness --complete
  - Use only Playwright 1.61.0 with the installed /usr/bin/google-chrome and /usr/bin/firefox executables; do not run playwright install or download a managed browser.
