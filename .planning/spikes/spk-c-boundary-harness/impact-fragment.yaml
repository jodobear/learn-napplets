proposedOpenQuestions:
  - id: OQ-FIREFOX-PLAYWRIGHT-LAUNCH-001
    rationale: Firefox 152.0.4 exited before Playwright 1.61.0 attached, so no browser fixture behavior exists to assess the required boundary primitives.
proposedDriftRecords:
  - id: DRF-FIREFOX-PLAYWRIGHT-LAUNCH-001
    rationale: The approved direct-installed Firefox execution surface did not produce the clean-context automation behavior expected by the Phase 1 browser matrix; retain the observed launcher mismatch without inferring browser protocol behavior.
compatibilityObservations:
  - browser: Chromium / Google Chrome 150.0.7871.124
    status: passed
    classification: observed-browser-behavior
    rationale: Five fresh contexts completed the isolated injection, postMessage, source-mapping, declared-domain removal, envelope, and deterministic-response contract.
  - browser: Firefox 152.0.4
    status: blocked
    classification: observed-browser-behavior
    rationale: All five required samples were blocked at Playwright launch; no fixture execution or browser primitive result was observed.
affectedRequirements: [EVID-04]
affectedPhases: ['01', '02', '05']
uncertainty:
  state: material
  reason: The only source bindings are blocked project-policy records, and the Firefox execution surface supplied no fixture observation; SPK-C cannot select or prove a cross-browser teaching-host profile.
proposedImpacts:
  - type: requirement
    id: EVID-04
    rationale: Mandatory browser spike evidence remains blocked until both declared browser surfaces produce replayable fixture observations or the impact is formally deferred with approval.
  - type: adr
    id: ADR-0005
    rationale: The evidence is proposed only and contains a Firefox execution blocker; it cannot support an accepted host-profile decision.
  - type: phase
    id: '01'
    rationale: Phase 1 retains the browser evidence blocker and its immutable local hand-off.
  - type: phase
    id: '02'
    rationale: Phase 2 must not turn the fixture into selected architecture while SPK-C remains blocked.
  - type: phase
    id: '05'
    rationale: The first production-like vertical slice must retain the static/deferred fallback until a reviewed cross-browser boundary baseline exists.
