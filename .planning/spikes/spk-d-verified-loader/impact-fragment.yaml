proposedOpenQuestions:
- id: OQ-VERIFIED-LOADER-MANIFEST-001
  rationale: Identify and review the current immutable manifest source and a public
    reviewed resolver before any manifest-resolution experiment is attempted.
- id: OQ-VERIFIED-LOADER-IDENTITY-001
  rationale: Identify and review the current immutable identity mapping, including
    any dTag or aggregate identity tuple, before presenting or implementing identity
    behavior.
- id: OQ-VERIFIED-LOADER-VERIFIER-001
  rationale: Identify reviewed public provenance for signature, blob, aggregate, and
    exact-byte loader verification before re-running SPK-D beyond local digest integrity.
proposedDriftRecords:
- id: DRF-MANIFEST-001
  rationale: SPK-D retains the existing blocked manifest-source drift record; local
    fixture output does not settle manifest kinds or resolution behavior.
- id: DRF-IDENTITY-001
  rationale: SPK-D retains the existing blocked identity drift record; no dTag or
    aggregate identity rule was supplied or inferred.
- id: DRF-ARTIFACT-001
  rationale: SPK-D retains the existing blocked artifact drift record; synthetic bytes
    cannot establish release or loader behavior.
compatibilityObservations:
- browser: not-applicable — SPK-D is a non-browser local fixture
  status: blocked
  classification: observed-browser-behavior
  rationale: Schema-required classification label only; no browser was launched and
    no browser behavior was observed. The compatibility result is blocked because
    the reviewed verification surface is unavailable.
