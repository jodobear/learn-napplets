proposedImpacts:
- type: requirement
  id: EVID-04
  rationale: Required verified-loader feasibility evidence remains blocked until source-backed
    reviewed verification surfaces produce replayable observations.
- type: adr
  id: ADR-0005
  rationale: This is proposed blocked evidence only and cannot select a teaching-host
    or loader profile.
- type: adr
  id: ADR-0008
  rationale: This is proposed blocked evidence only and cannot support a mediated
    verification or authority recommendation.
- type: phase
  id: '01'
  rationale: Phase 1 retains SPK-D as an immutable local blocker hand-off pending
    Plan 01-28 validation and serial consolidation.
- type: phase
  id: '02'
  rationale: Phase 2 must retain a static/deferred fallback and must not implement
    a verified loader from this fixture.
