successThreshold: >-
  A current immutable manifest and identity source plus a publicly reviewed
  implementation surface resolve every declared verification primitive for the
  unchanged fixture and reject the one-byte mutation with replayable evidence.
failureOutcome: >-
  If a reviewed verification surface is available but the unchanged fixture or
  one-byte mutation produces a result inconsistent with its pinned contract,
  record the actual error and make no positive verified-loader recommendation.
blockedOutcome: >-
  If an immutable current manifest/identity baseline, reviewed verifier
  provenance, or approved execution surface is unavailable, record the byte
  fixture observation and an impact-scoped blocked result without adding a
  package, implementing cryptography, or claiming verification success.
replay:
  input: fixture.json
  command: >-
    Run the declared standard-library fixture-integrity assertion through
    tools/phase1-python, then validate the completed spike, report, and impact
    fragment. The assertion checks only supplied byte digests and the one-byte
    mutation; it does not implement or simulate protocol verification.
safety:
  noSecrets: true
  noDestructiveState: true
  liveProbe: not-used
uncertainty:
  state: material
  reason: >-
    The registry contains only project-policy/archive records and no immutable
    current manifest, identity, signature, blob, aggregate, or reviewed loader
    implementation evidence. Local digest observations cannot establish protocol
    behavior or a verified-loader profile.
recommendation: >-
  Keep SPK-D as a non-production blocked feasibility fixture. Do not select
  Profile 2 or teach manifest/identity/verification behavior until immutable
  source and reviewed verifier evidence are collected and approved.
