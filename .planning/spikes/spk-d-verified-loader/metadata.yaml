schemaVersion: 1
id: SPK-D-VERIFIED-LOADER
kind: spike
nonProduction: true
status: blocked
hypothesis: >-
  A current, immutable, publicly reviewed verification implementation and source
  baseline would be necessary to measure manifest resolution, identity mapping,
  signature/blob/aggregate verification, and exact-byte loading. With only the
  current blocked policy baseline, SPK-D can pin a local byte fixture and record
  an impact-scoped blocked result without manufacturing a verified-loader claim.
variables:
  independent: [fixture case, verification-surface availability]
  dependent: [pinned-byte integrity observation, mutation observation, feasibility disposition]
  controlled: [local fixture bytes, approved Phase 1 Python wrapper, no package installation, no network access, immutable policy bindings]
commands:
  - tools/phase1-python tools/validate-research.py validate-spike .planning/spikes/spk-d-verified-loader --contract
  - tools/phase1-python -c "import hashlib,json; f=json.load(open('.planning/spikes/spk-d-verified-loader/fixture.json')); b=bytes.fromhex(f['artifact']['exactBytesHex']); m=bytes([b[0]^1])+b[1:]; assert len(b)==f['artifact']['byteLength']==len(m); assert hashlib.sha256(b).hexdigest()==f['artifact']['sha256']; assert sum(x!=y for x,y in zip(b,m))==1; assert hashlib.sha256(m).hexdigest()==f['mutationCase']['sha256']; assert all(s['status']=='blocked' for s in f['verificationSurfaces'])"
  - tools/phase1-python tools/validate-research.py validate-spike .planning/spikes/spk-d-verified-loader --complete
  - tools/phase1-python tools/validate-research.py validate-report .planning/spikes/spk-d-verified-loader/report.md
  - tools/phase1-python tools/validate-research.py validate-impact-fragment --root .planning .planning/spikes/spk-d-verified-loader/impact-fragment.yaml
