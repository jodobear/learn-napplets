      shasum: f80d8459c10fff08b2c457e9171547f32761582c
      provenanceRetrievedAt: '2026-07-24'
      provenanceSource: https://registry.npmjs.org/astro/7.1.3
      hashSourceDecision: >-
        Pending human review: the official npm registry release integrity and
