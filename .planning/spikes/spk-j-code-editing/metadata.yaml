schemaVersion: 1
id: SPK-J-CODE-EDITING
kind: spike
nonProduction: true
status: blocked
hypothesis: >-
  A fixed tested variant or a controlled native textarea can meet the declared
  synthetic learning task with less authority, lower startup cost, deterministic
  replay, and clearer accessibility than a package editor; a lightweight editor
  or CodeMirror may be measured only after its exact dependency record receives
  a dated human supply-chain decision.
variables:
  independent:
    - fixed tested synthetic variants
    - controlled native textarea edits limited to declared safe variants
    - lightweight editor candidate with no arbitrary code execution
    - CodeMirror package candidate set with pinned direct package records
  dependent:
    - learner task completion and accepted-edit classification
    - keyboard and screen-reader interaction evidence
    - static fallback and deterministic reset/replay result
    - fixture and candidate package byte/startup cost
    - trusted-context sentinel and arbitrary-input containment result
  controlled:
    - synthetic local JavaScript-like text only; no credentials, uploads, telemetry, or network target
    - fixture inspects text with exact matching and never evaluates learner input
    - direct-installed Chromium and Firefox through approved Playwright 1.61.0 when Task 3 runs
    - five clean local samples per available browser; generated output remains under /tmp/spk-j-code-editing
    - no package-manager call, editor import, or production scaffold before Task 2 records per-package human status
commands:
  - tools/phase1-python tools/validate-research.py validate-spike .planning/spikes/spk-j-code-editing --contract
  - npm --prefix .planning/spikes/spk-j-code-editing/.experiment/codemirror-6-core install --ignore-scripts --package-lock=false @codemirror/state@6.5.2 @codemirror/view@6.38.6 @codemirror/commands@6.8.1 @codemirror/lang-javascript@6.2.3
  - tools/phase1-python .planning/spikes/spk-j-code-editing/runner.py --fixture .planning/spikes/spk-j-code-editing/fixture.html --experiment .planning/spikes/spk-j-code-editing/.experiment/codemirror-6-core --out /tmp/spk-j-code-editing
  - tools/phase1-python tools/validate-research.py validate-spike .planning/spikes/spk-j-code-editing --complete
  - tools/phase1-python tools/validate-research.py validate-report .planning/spikes/spk-j-code-editing/report.md
  - tools/phase1-python tools/validate-research.py validate --root .planning/research --report /tmp/spk-j-research-validation.md
environmentManifest: environment.json
sourceBindings:
  - sourceId: SRC-POLICY-002
    claimId: CLM-POLICY-001
    primitive: immutable evidence and human review gate for editing candidates
    relation: supports
    plan: 01-18
    expectedClassification: project-policy
    immutable:
      commitSha: b534103068be8c07e6869bfb7290fb60fdd87c8c
      path: .planning/governance/evidence-policy.md
      locator: Required fields and verification rule
      contentSha256: 9d3f9697cc7058b8edcb5b2a346ff9de677ca10b5b163d1ba1b7f40d7d01c4b2
      retrievedAt: '2026-07-24T00:00:00Z'
      authorityTier: project-policy
      evidenceClass: project-policy
      maturity: accepted
successThreshold: >-
  In each available browser, five local replays show that fixed variants and the
  controlled textarea complete the synthetic task with keyboard-reachable
  labels, visible focus, announced accepted/rejected edit state, a static
  no-JavaScript-readable fallback, deterministic reset/replay, no network or
  persistence, and an unchanged trusted-context sentinel. A package editor can
  be measured only if every exact package version, registry/repository source,
  public export locator, license, integrity, immutable source revision,
  maintenance/bundle evidence, and dated human decision is recorded before
  installation. The normal dependency-closure review is required unless the
  dated decision explicitly accepts a narrowly scoped non-production exception.
failureOutcome: >-
  If a local fixed or controlled candidate loses keyboard, visible-focus,
  status-announcement, static-equivalence, reset/replay, containment, or
  sentinel checks in an available browser, retain the observed failure and make
  no positive editing recommendation. Do not compensate by evaluating learner
  input, adding a production component, or substituting an unreviewed editor.
blockedOutcome: >-
  If a candidate lacks a complete exact package record, immutable source/API
  evidence, or Task 2 dated human approval, it remains blocked and no
  install/import/measurement occurs. An incomplete dependency closure also
  remains blocked unless the human decision explicitly accepts a scoped
  non-production exception. If an approved browser cannot launch through the
  approved direct-installed route, record that exact browser scope as blocked
  without downloading a browser or changing flags, profiles, or preferences.
replay:
  input: fixture.html
  command: >-
    Before approval, validate the contract and inspect fixture.html for its
    exact-match-only edit classification and absence of dynamic code execution.
    After approval, run only the approved isolated candidate command and the
    declared five-sample browser replay.
safety:
  noSecrets: true
  noDestructiveState: true
  liveProbe: not-used
  essential: true
uncertainty:
  state: material
  reason: >-
    This planned fixture can establish only local browser behavior for synthetic
    text. It cannot establish learner comprehension, screen-reader speech,
    production bundle behavior, upstream protocol behavior, or a selected
    editor. CodeMirror is approved only for this isolated non-production
    experiment under a dated human exception to complete resolved dependency-lock
    review; CodeJar has a source-version mismatch and remains ineligible.
recommendation: >-
  Start comparison with fixed tested variants and a controlled textarea. Retain
  the native lightweight shell as an inspection-only candidate. CodeJar remains
  blocked for its source-version mismatch. The exact CodeMirror direct package
  set is approved only for the SPK-J-local non-production experiment under the
  dated human exception to dependency-lock review. ADR-0009 receives proposed
  evidence only; no production editor is selected.
disposition: retain-as-fixture
